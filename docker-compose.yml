services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hexcampaign
      POSTGRES_PASSWORD: hexcampaign
      POSTGRES_DB: hexcampaign
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexcampaign -d hexcampaign"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
