name: backend

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hexcampaign
          POSTGRES_PASSWORD: hexcampaign
          POSTGRES_DB: hexcampaign
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hexcampaign -d hexcampaign"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hexcampaign:hexcampaign@localhost:5432/hexcampaign
      DJANGO_SETTINGS_MODULE: config.settings.test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy --strict
      - name: Pytest
        run: pytest --cov=hexcampaign --cov=api --cov=apps --cov-report=term-missing --cov-fail-under=86
