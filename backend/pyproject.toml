[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hex-campaign"
version = "0.1.0"
description = "Server-side campaign map for tabletop miniature games."
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "django-stubs>=5.2,<6",
    "django-stubs-ext>=5.2,<6",
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5",
    "pytest-django>=4.11",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "C4",
    "PIE",
    "RUF",
    "T20",
    "DTZ",
    "ASYNC",
    "A",
    "LOG",
    "S",
]
# S311: turn order and ownership use random.Random on purpose. Tokens use secrets.
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "I001", "S", "RUF012"]
"_make_user.py" = ["T201"]
"tests/**" = ["S101", "S105", "S106"]
"config/settings/test.py" = ["S105", "S106"]
"config/settings/guards.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = [
    "src/hexcampaign",
    "apps",
    "api",
    "config/asgi.py",
    "config/wsgi.py",
    "config/settings/guards.py",
]
plugins = ["mypy_django_plugin.main"]
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
strict_equality = true
warn_unused_configs = true

[tool.coverage.run]
source = ["hexcampaign", "api", "apps"]
omit = ["*/migrations/*"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = ["hexcampaign.*", "api.*"]
strict = true

[[tool.mypy.overrides]]
module = ["apps.*", "config.*"]
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false
no_implicit_reexport = false
extra_checks = false

[[tool.mypy.overrides]]
module = "apps.*.migrations.*"
ignore_errors = true
